<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#0f0f1a"/>
<meta name="description" content="Score4Fun — The sports prediction platform. Pick your game and play."/>
<meta property="og:title" content="Score4Fun Platform"/>
<meta property="og:description" content="Multi-game sports prediction platform. Forecast, Hidden Eleven and more."/>
<title>Score4Fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0f1a;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 16px 40px;}

/* HEADER */
.hub-header{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;padding:20px 0 0;}
.hub-wordmark{font-size:18px;font-weight:800;color:#f5c842;letter-spacing:-.3px;}
.hub-wordmark span{color:#fff;}
.hub-user{width:34px;height:34px;border-radius:50%;background:#1e1e32;border:1.5px solid #2a2a42;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.hub-user svg{width:16px;height:16px;fill:#888;}

/* HERO */
.hub-hero{width:100%;max-width:480px;margin-top:24px;background:linear-gradient(145deg,#1a1a2e 0%,#12121f 100%);border:1px solid rgba(245,200,66,.2);border-radius:24px;padding:28px 24px 24px;text-align:center;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.25);border-radius:24px;padding:5px 14px;font-size:11px;font-weight:600;color:#f5c842;letter-spacing:.06em;margin-bottom:16px;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:#f5c842;animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.hero-logo{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1;}
.hero-logo .gold{color:#f5c842;}
.hero-tagline{font-size:14px;color:rgba(255,255,255,.45);margin-top:6px;margin-bottom:18px;}
.hero-cta{font-size:17px;font-weight:600;color:#fff;}
.hero-cta .hl{color:#f5c842;}

/* GAMES GRID */
.section-label{width:100%;max-width:480px;margin-top:28px;font-size:11px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;}
.tiles{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* TILE BASE */
.tile{border-radius:20px;padding:18px 16px 14px;position:relative;overflow:hidden;cursor:pointer;text-decoration:none;display:block;transition:transform .18s ease,box-shadow .18s ease;}
.tile:hover{transform:translateY(-3px);}
.tile-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:10px;letter-spacing:.05em;}
.tile-icon{font-size:32px;display:block;margin-bottom:8px;line-height:1;}
.tile-name{font-size:16px;font-weight:700;margin-bottom:3px;}
.tile-desc{font-size:11px;line-height:1.45;}
.tile-arrow{position:absolute;top:14px;right:14px;font-size:14px;opacity:.3;}
.tile-build{position:absolute;bottom:12px;right:14px;font-size:11px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.02em;}

/* FORECAST — gold */
.tile-forecast{background:#1a1728;border:1.5px solid rgba(245,200,66,.5);padding-bottom:30px;}
.tile-forecast:hover{box-shadow:0 8px 24px rgba(245,200,66,.12);}
.tile-forecast .tile-badge{background:#f5c842;color:#1a1200;}
.tile-forecast .tile-name{color:#fff;}
.tile-forecast .tile-desc{color:rgba(255,255,255,.5);}
.tile-forecast .tile-arrow{color:#f5c842;opacity:.6;}

/* HIDDEN ELEVEN — green */
.tile-h11{background:#0d1f1a;border:1.5px solid rgba(46,204,138,.4);padding-bottom:30px;}
.tile-h11:hover{box-shadow:0 8px 24px rgba(46,204,138,.1);}
.tile-h11 .tile-badge{background:#2ecc8a;color:#001a0d;}
.tile-h11 .tile-name{color:#fff;}
.tile-h11 .tile-desc{color:rgba(255,255,255,.5);}
.tile-h11 .tile-arrow{color:#2ecc8a;opacity:.6;}

/* COMING SOON */
.tile-soon{background:#161620;border:1px solid rgba(255,255,255,.07);cursor:default;}
.tile-soon .tile-badge{background:rgba(255,255,255,.06);color:rgba(255,255,255,.3);border:0.5px solid rgba(255,255,255,.1);}
.tile-soon .tile-icon{opacity:.25;filter:grayscale(1);}
.tile-soon .tile-name{color:rgba(255,255,255,.25);}
.tile-soon .tile-desc{color:rgba(255,255,255,.15);}

</style>
</head>
<body>

<div class="hub-header">
  <div class="hub-wordmark">Score<span>4</span>Fun</div>
  <div class="hub-user">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
  </div>
</div>

<div class="hub-hero">
  <div class="hero-badge"><span class="badge-dot"></span>Welcome to Score4Fun</div>
  <div class="hero-logo"><span class="gold">Score</span>4Fun</div>
  <div class="hero-tagline">The sports prediction platform</div>
  <div class="hero-cta">Pick a game and <span class="hl">play</span> 👇</div>
</div>

<div class="section-label">Choose your game</div>

<div class="tiles">
  <a class="tile tile-forecast" href="/forecast">
    <span class="tile-badge">🟡 Live</span>
    <span class="tile-icon">🏆</span>
    <div class="tile-name">Forecast</div>
    <div class="tile-desc">Bracket &amp; match predictions</div>
    <span class="tile-build" id="forecast-build">Build V150</span>
    <span class="tile-arrow">↗</span>
  </a>

  <a class="tile tile-h11" href="/hidden11">
    <span class="tile-badge">🟢 Beta</span>
    <span class="tile-icon">🔍</span>
    <div class="tile-name">Hidden Eleven</div>
    <div class="tile-desc">FPL word-search + spin wheel</div>
    <span class="tile-build" id="h11-build">Build V1</span>
    <span class="tile-arrow">↗</span>
  </a>

  <div class="tile tile-soon">
    <span class="tile-badge">Coming soon</span>
    <span class="tile-icon">🎯</span>
    <div class="tile-name">Game 3</div>
    <div class="tile-desc">À venir...</div>
  </div>

  <div class="tile tile-soon">
    <span class="tile-badge">Coming soon</span>
    <span class="tile-icon">⚡</span>
    <div class="tile-name">Game 4</div>
    <div class="tile-desc">À venir...</div>
  </div>
</div>



<script>
/* Game version constants — update ONLY when that game changes */
const FORECAST_BUILD = 'V150';
const H11_BUILD      = 'V1';
document.getElementById('forecast-build').textContent = 'Build ' + FORECAST_BUILD;
document.getElementById('h11-build').textContent      = 'Build ' + H11_BUILD;
</script>

</body>
</html>
